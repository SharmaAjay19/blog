  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg-soft:   #fafafa;
      --bg-code:   #f6f8fa;
      --text:      #242424;
      --text-soft: #5c5c5c;
      --text-faint:#8a8a8a;
      --border:    #ececec;
      --border-2:  #dcdcdc;
      --accent:    #1a8917;
      --serif:     'Source Serif 4', Georgia, 'Times New Roman', serif;
      --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono:      ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      --max:       720px;
      --wide:      1100px;
      --ease:      cubic-bezier(.4,0,.2,1);
    }

    html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* ── Reading progress bar ─────────────────────────────────────── */
    #progress {
      position: fixed; top: 0; left: 0;
      height: 3px; width: 0%;
      background: var(--accent);
      z-index: 200;
      transition: width .08s linear;
      display: none;
    }

    /* ── Navigation ───────────────────────────────────────────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.85);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
    }
    .nav-logo {
      font-family: var(--serif);
      font-weight: 700; font-size: 1.3rem;
      letter-spacing: -.01em; color: var(--text);
      cursor: pointer; text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link {
      font-family: var(--sans); font-size: .85rem; font-weight: 500;
      color: var(--text-soft); text-decoration: none;
      cursor: pointer; transition: color .15s;
    }
    .nav-link:hover { color: var(--accent); }

    main { min-height: calc(100vh - 64px - 72px); }

    /* ── Footer ───────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .footer-brand {
      font-family: var(--serif); font-weight: 700; font-size: 1.05rem;
      color: var(--text);
    }
    .footer-copy {
      font-size: .85rem; color: var(--text-faint);
    }

    /* ── Page transitions ─────────────────────────────────────────── */
    .appear { animation: appear .3s var(--ease) both; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════════════════════════
       HOME PAGE
    ═══════════════════════════════════════════════════════════════ */

    .hero {
      border-bottom: 1px solid var(--border);
      padding: 5rem 2rem 3.5rem;
    }
    .hero-inner { max-width: var(--wide); margin: 0 auto; }
    .hero-kicker {
      font-family: var(--sans); font-size: .78rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1.25rem;
    }
    .masthead {
      font-family: var(--serif);
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 700; letter-spacing: -.03em;
      line-height: 1; color: var(--text);
      margin-bottom: 1.5rem;
    }
    .hero-tagline {
      font-family: var(--serif);
      font-size: 1.3rem; color: var(--text-soft);
      line-height: 1.55; max-width: 560px; margin-bottom: 2rem;
    }
    .hero-meta {
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap; font-size: .85rem; color: var(--text-faint);
    }
    .hero-meta .em { color: var(--text-soft); font-weight: 500; }
    .hero-meta-sep { color: var(--border-2); }

    /* Articles section */
    .articles-wrap {
      max-width: var(--wide); margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }
    .section-label {
      font-family: var(--sans); font-size: .78rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: 1.75rem;
    }

    /* Featured card */
    .featured {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 2.25rem 2.5rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .featured:hover {
      border-color: var(--border-2);
      box-shadow: 0 12px 28px rgba(0,0,0,.07);
      transform: translateY(-2px);
    }
    .card-eyebrow {
      font-family: var(--sans); font-size: .78rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1rem;
    }
    .featured-title {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 4vw, 2.4rem);
      font-weight: 700; letter-spacing: -.02em; line-height: 1.12;
      color: var(--text); margin-bottom: .65rem;
    }
    .featured-sub {
      font-family: var(--serif);
      font-size: 1.1rem; color: var(--text-soft);
      line-height: 1.55; max-width: 600px; margin-bottom: 1.5rem;
    }
    .card-foot {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .card-date { font-size: .85rem; color: var(--text-faint); }
    .tags { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tag {
      font-family: var(--sans); font-size: .75rem; color: var(--text-soft);
      background: var(--bg-soft); border: 1px solid var(--border);
      padding: .25em .7em; border-radius: 100px;
    }
    .read-time {
      font-size: .85rem; color: var(--text-faint); margin-left: auto;
      display: inline-flex; align-items: center;
    }
    .read-arrow { color: var(--accent); margin-left: .35rem; transition: transform .2s; }
    .featured:hover .read-arrow { transform: translateX(3px); }

    /* Article grid (non-featured) */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
      gap: 1.25rem; margin-top: 1.5rem;
    }
    .article-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.75rem 1.9rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .article-card:hover {
      border-color: var(--border-2);
      box-shadow: 0 10px 24px rgba(0,0,0,.06);
      transform: translateY(-2px);
    }
    .article-card-title {
      font-family: var(--serif); font-weight: 700; font-size: 1.3rem;
      letter-spacing: -.015em; line-height: 1.2;
      color: var(--text); margin-bottom: .5rem;
    }
    .article-card-sub {
      font-family: var(--serif);
      font-size: .98rem; color: var(--text-soft);
      line-height: 1.5; margin-bottom: 1.1rem;
    }

    /* ═══════════════════════════════════════════════════════════════
       ARTICLE PAGE
    ═══════════════════════════════════════════════════════════════ */

    .article-back-bar {
      max-width: var(--max); margin: 0 auto;
      padding: 2rem 2rem 0;
    }
    .back-btn {
      font-family: var(--sans); font-size: .85rem; font-weight: 500;
      color: var(--text-soft); cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: .45rem;
      transition: color .15s; border: none; background: none;
    }
    .back-btn::before { content: '←'; }
    .back-btn:hover { color: var(--accent); }

    .article-hd {
      max-width: var(--max); margin: 0 auto;
      padding: 2.5rem 2rem 2rem;
    }
    .article-tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .article-title {
      font-family: var(--serif);
      font-size: clamp(2.1rem, 5.5vw, 3.25rem);
      font-weight: 700; letter-spacing: -.025em; line-height: 1.12;
      color: var(--text); margin-bottom: 1rem;
    }
    .article-subtitle {
      font-family: var(--serif);
      font-size: 1.3rem; color: var(--text-soft);
      line-height: 1.5; margin-bottom: 1.75rem;
    }
    .article-byline {
      display: flex; align-items: center; gap: .55rem;
      font-size: .9rem; color: var(--text-faint); flex-wrap: wrap;
      padding-top: 1.5rem; border-top: 1px solid var(--border);
    }
    .byline-author { color: var(--text); font-weight: 600; }
    .byline-sep { color: var(--border-2); }

    /* ── Article body typography ───────────────────────────────────── */
    .article-body {
      max-width: var(--max); margin: 0 auto;
      padding: 1rem 2rem 6rem;
      font-family: var(--serif); font-size: 1.25rem;
      line-height: 1.7; color: var(--text);
    }

    /* Headings */
    .article-body h1,
    .article-body h2,
    .article-body h3,
    .article-body h4 {
      font-family: var(--serif);
      color: var(--text); letter-spacing: -.02em;
    }
    .article-body h1 {
      font-size: 2rem; font-weight: 700; line-height: 1.15;
      margin: 3rem 0 1.25rem;
    }
    .article-body h2 {
      font-size: 1.7rem; font-weight: 700; line-height: 1.2;
      margin: 3rem 0 1rem;
    }
    .article-body h3 {
      font-size: 1.35rem; font-weight: 700; line-height: 1.3;
      margin: 2.5rem 0 .75rem;
    }
    .article-body h4 {
      font-size: 1.1rem; font-weight: 600;
      color: var(--text-soft); margin: 2rem 0 .5rem;
    }
    .article-body > h1:first-child,
    .article-body > h2:first-child { margin-top: 0; }

    /* Body text */
    .article-body p { margin-bottom: 1.6rem; }
    .article-body p:last-child { margin-bottom: 0; }
    /* Standfirst — the opening deck paragraph reads as an editorial lead */
    .article-body > p:first-child {
      font-size: 1.4rem; line-height: 1.5; color: var(--text-soft);
      margin-bottom: 1.9rem;
    }
    .article-body strong { font-weight: 700; color: var(--text); }
    .article-body em { font-style: italic; }

    /* Links */
    .article-body a {
      color: var(--text); text-decoration: underline;
      text-decoration-color: var(--border-2);
      text-underline-offset: 3px; transition: color .15s, text-decoration-color .15s;
    }
    .article-body a:hover {
      color: var(--accent); text-decoration-color: var(--accent);
    }

    /* Lists */
    .article-body ul, .article-body ol {
      padding-left: 1.5rem; margin-bottom: 1.6rem;
    }
    .article-body li { margin-bottom: .6rem; padding-left: .25rem; }
    .article-body li::marker { color: var(--text-faint); }

    /* Blockquotes (callouts) */
    .article-body blockquote {
      margin: 2rem 0;
      padding: .25rem 0 .25rem 1.75rem;
      border-left: 3px solid var(--accent);
    }
    .article-body blockquote p {
      font-family: var(--serif); font-style: italic;
      color: var(--text-soft); margin-bottom: 0;
      font-size: 1.2rem; line-height: 1.6;
    }
    .article-body blockquote strong { color: var(--text); }

    /* Inline code */
    .article-body :not(pre) > code {
      font-family: var(--mono); font-size: .85em;
      background: var(--bg-code);
      padding: .15em .4em; border-radius: 4px;
      color: #c7254e; border: 1px solid var(--border);
    }

    /* Code blocks */
    .article-body pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      overflow-x: auto; margin: 1.75rem 0;
    }
    .article-body pre code {
      background: none; padding: 0; border: none;
      font-size: .9rem; line-height: 1.6;
      font-family: var(--mono);
      color: #24292e;
    }

    /* Mermaid diagrams */
    .article-body .mermaid {
      margin: 2rem 0; padding: 1.5rem; text-align: center;
      background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 8px; overflow-x: auto; line-height: 1.4;
    }
    .article-body .mermaid svg { max-width: 100%; height: auto; }

    /* Tables */
    .article-body table {
      width: 100%; border-collapse: collapse;
      margin: 2rem 0; font-family: var(--sans);
      font-size: .92rem; line-height: 1.5;
      overflow-x: auto; display: block;
    }
    .article-body thead tr { border-bottom: 2px solid var(--border-2); }
    .article-body th {
      text-align: left; padding: .65rem .9rem;
      color: var(--text); font-weight: 600; white-space: nowrap;
    }
    .article-body td {
      padding: .65rem .9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top; color: var(--text-soft);
    }
    .article-body tr:last-child td { border-bottom: none; }
    .article-body tbody tr:hover td { background: var(--bg-soft); }

    /* Horizontal rule */
    .article-body hr {
      border: none; border-top: 1px solid var(--border);
      margin: 3rem auto; width: 40%;
    }
    /* ── Article feedback (thumbs up / down) ────────────────── */
    .article-feedback {
      max-width: var(--max); margin: -3rem auto 5rem;
      padding: 2.5rem 2rem 0;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }
    .feedback-q {
      font-family: var(--sans); font-size: .95rem; font-weight: 600;
      color: var(--text);
    }
    .feedback-btns { display: flex; gap: .6rem; }
    .feedback-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      font-family: var(--sans); font-size: .85rem; font-weight: 500;
      color: var(--text-soft); cursor: pointer;
      background: var(--bg); border: 1px solid var(--border-2);
      border-radius: 100px; padding: .45em 1em;
      transition: color .15s, border-color .15s, background .15s;
    }
    .feedback-btn:hover { color: var(--text); border-color: var(--text-faint); }
    .feedback-btn svg { width: 16px; height: 16px; display: block; }
    .feedback-btn.is-selected {
      color: var(--accent); border-color: var(--accent);
      background: rgba(26,137,23,.07);
    }
    .feedback-thanks {
      font-family: var(--sans); font-size: .85rem; color: var(--text-faint);
    }
    @media (max-width: 600px) {
      .article-feedback { padding: 2rem 1.25rem 0; }
    }

    /* ── Floating feedback rail (right margin, wide screens only) ─── */
    .feedback-rail {
      position: fixed; right: 1.5rem; top: 50%; transform: translateY(-50%);
      z-index: 90; display: none;
      flex-direction: column; align-items: center; gap: .5rem;
      background: rgba(255,255,255,.92); backdrop-filter: saturate(180%) blur(8px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: .75rem .6rem;
      box-shadow: 0 6px 22px rgba(0,0,0,.08);
    }
    .rail-label {
      font-family: var(--sans); font-size: .58rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: .1rem;
    }
    .rail-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; padding: 0;
      color: var(--text-soft); cursor: pointer;
      background: var(--bg); border: 1px solid var(--border-2);
      border-radius: 50%;
      transition: color .15s, border-color .15s, background .15s, transform .1s;
    }
    .rail-btn:hover { color: var(--text); border-color: var(--text-faint); }
    .rail-btn:active { transform: scale(.92); }
    .rail-btn svg { width: 17px; height: 17px; display: block; }
    .rail-btn.is-selected {
      color: var(--accent); border-color: var(--accent);
      background: rgba(26,137,23,.08);
    }
    /* Only show the rail where the page has margin room for it */
    @media (min-width: 1080px) {
      .feedback-rail { display: flex; }
    }

    /* ── Loading state ─────────────────────────────────────────────── */
    .loading {
      display: flex; align-items: center; gap: .75rem;
      padding: 3rem 2rem; max-width: var(--max); margin: 0 auto;
      font-size: .9rem; color: var(--text-faint);
    }
    .loading-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: .7;
      animation: pulse .9s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: .15s; }
    .loading-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%,100% { opacity: .2; transform: scale(.8); }
      50%      { opacity: 1;  transform: scale(1); }
    }

    /* ── Error state ───────────────────────────────────────────────── */
    .error-msg {
      max-width: var(--max); margin: 3rem auto;
      padding: 1.5rem 1.75rem;
      border: 1px solid var(--border); border-left: 3px solid #e5484d;
      border-radius: 8px;
      font-size: .95rem; line-height: 1.6; color: var(--text-soft);
      background: var(--bg-soft);
    }
    .error-msg code {
      font-family: var(--mono); font-size: .85em;
      background: var(--bg); padding: .1em .4em; border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      nav { padding: 0 1.25rem; height: 58px; }
      .hero { padding: 3.5rem 1.25rem 2.5rem; }
      .articles-wrap { padding: 2rem 1.25rem 4rem; }
      .featured { padding: 1.75rem 1.5rem; }
      .article-back-bar { padding: 1.5rem 1.25rem 0; }
      .article-hd { padding: 2rem 1.25rem 1.5rem; }
      .article-body { padding: 1rem 1.25rem 4rem; font-size: 1.15rem; }
      .read-time { display: none; }
      footer { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>

/* ════════════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════════════ */

function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function estimateReadTime(text) {
  const words = text.trim().split(/\s+/).length;
  const mins  = Math.max(1, Math.round(words / 220));
  return mins + ' min read';
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function tagsHTML(tags) {
  return (tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
}

/* ════════════════════════════════════════════════════════════════════════
   ANALYTICS — send a GA4 page_view per SPA route
   (the article lives in the #hash, so we send one virtual pageview per
   article/home render; each shows up as its own page in GA4)
════════════════════════════════════════════════════════════════════════ */

function trackPageView(file) {
  if (typeof gtag !== 'function') return;
  const path = location.pathname + (file ? '?read=' + encodeURIComponent(file) : '');
  gtag('event', 'page_view', {
    page_title: document.title,
    page_location: location.origin + path
  });
}

/* ════════════════════════════════════════════════════════════════════════
   ARTICLE FEEDBACK — thumbs up/down, recorded to GA4 + localStorage
════════════════════════════════════════════════════════════════════════ */

function setupFeedback(file, title) {
  const groups = [document.getElementById('feedback'), document.getElementById('feedback-rail')].filter(Boolean);
  if (!groups.length) return;
  const key = 'feedback:' + file;
  let current = null;
  try { current = localStorage.getItem(key); } catch (e) {}

  const btns = [];
  groups.forEach(g => g.querySelectorAll('[data-vote]').forEach(b => btns.push(b)));

  function paint() {
    btns.forEach(b => b.classList.toggle('is-selected', b.dataset.vote === current));
    groups.forEach(g => {
      const t = g.querySelector('.feedback-thanks');
      if (t) t.hidden = !current;
    });
  }
  paint();

  btns.forEach(b => b.addEventListener('click', () => {
    const vote = b.dataset.vote;                 // 'up' | 'down'
    if (vote === current) return;                // already the active vote
    current = vote;
    try { localStorage.setItem(key, vote); } catch (e) {}
    paint();                                      // keep both widgets in sync
    if (typeof gtag === 'function') {
      gtag('event', 'article_feedback', {
        rating: vote,
        article_file: file,
        article_title: title,
        placement: b.closest('#feedback-rail') ? 'rail' : 'inline'
      });
    }
  }));
}

/* ════════════════════════════════════════════════════════════════════
   MARKED — configure renderer with syntax highlighting
════════════════════════════════════════════════════════════════════ */

function configureMarked() {
  const renderer = new marked.Renderer();

  renderer.code = function(code, lang) {
    const text = typeof code === 'object' ? code.text : code;
    const info = (typeof code === 'object' ? code.lang : lang) || '';
    const langId = info.trim().split(/\s+/)[0];

    // Mermaid blocks render as diagrams, not highlighted code
    if (langId === 'mermaid') {
      return `<div class="mermaid">${esc(text)}</div>`;
    }

    const language = (langId && hljs.getLanguage(langId)) ? langId : 'plaintext';
    let highlighted;
    try {
      highlighted = hljs.highlight(text, { language, ignoreIllegals: true }).value;
    } catch (e) {
      highlighted = esc(text);
    }
    return `<pre><code class="hljs language-${esc(language)}">${highlighted}</code></pre>`;
  };

  // Open external links in new tab
  renderer.link = function(href, title, text) {
    const h = typeof href === 'object' ? href.href : href;
    const t = typeof href === 'object' ? href.title : title;
    const isExt = h && (h.startsWith('http://') || h.startsWith('https://'));
    const attrs = isExt ? ' target="_blank" rel="noopener noreferrer"' : '';
    return `<a href="${esc(h || '')}"${t ? ` title="${esc(t)}"` : ''}${attrs}>${text}</a>`;
  };

  marked.use({ renderer, gfm: true, breaks: false });
}

/* ════════════════════════════════════════════════════════════════════
   READING PROGRESS
════════════════════════════════════════════════════════════════════ */

let progressOn = false;

function startProgress() {
  document.getElementById('progress').style.display = 'block';
  progressOn = true;
  tickProgress();
}

function stopProgress() {
  progressOn = false;
  const bar = document.getElementById('progress');
  bar.style.display = 'none';
  bar.style.width    = '0%';
}

function tickProgress() {
  if (!progressOn) return;
  const scrollTop    = document.documentElement.scrollTop || document.body.scrollTop;
  const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
}

window.addEventListener('scroll', tickProgress, { passive: true });

/* ════════════════════════════════════════════════════════════════════
   ROUTER
════════════════════════════════════════════════════════════════════ */

function getRoute() {
  const h = window.location.hash;
  if (h.startsWith('#read=')) {
    return { page: 'article', file: decodeURIComponent(h.slice(6)) };
  }
  return { page: 'home' };
}

function route() {
  const r = getRoute();
  if (r.page === 'article') renderArticle(r.file);
  else                       renderHome();
  window.scrollTo(0, 0);
}

function goHome() {
  stopProgress();
  history.pushState('', document.title, window.location.pathname + window.location.search);
  renderHome();
  window.scrollTo(0, 0);
}

function goArticle(file) {
  window.location.hash = '#read=' + encodeURIComponent(file);
}

/* ════════════════════════════════════════════════════════════════════
   HOME
════════════════════════════════════════════════════════════════════ */

function renderHome() {
  stopProgress();
  document.title = 'Agentic — Intelligence for Builders';

  const featured = ARTICLES.find(a => a.featured) || ARTICLES[0];
  const rest      = ARTICLES.filter(a => a !== featured);

  const featuredCard = featured ? `
    <div class="featured" onclick="goArticle('${esc(featured.file)}')" role="article" tabindex="0"
         onkeydown="if(event.key==='Enter') goArticle('${esc(featured.file)}')">
      <div class="card-eyebrow">Featured</div>
      <div class="featured-title">${esc(featured.title)}</div>
      <div class="featured-sub">${esc(featured.subtitle)}</div>
      <div class="card-foot">
        <span class="card-date">${fmtDate(featured.date)}</span>
        <div class="tags">${tagsHTML(featured.tags)}</div>
        <span class="read-time">${featured.readTime || '18 min read'}<span class="read-arrow">→</span></span>
      </div>
    </div>` : '';

  const gridCards = rest.map(a => `
    <div class="article-card" onclick="goArticle('${esc(a.file)}')" role="article" tabindex="0"
         onkeydown="if(event.key==='Enter') goArticle('${esc(a.file)}')">
      <div class="article-card-title">${esc(a.title)}</div>
      <div class="article-card-sub">${esc(a.subtitle)}</div>
      <div class="card-foot">
        <span class="card-date">${fmtDate(a.date)}</span>
        <div class="tags">${tagsHTML(a.tags)}</div>
      </div>
    </div>`).join('');

  const grid = rest.length ? `
    <div class="section-label" style="margin-top:3rem">More Articles</div>
    <div class="article-grid">${gridCards}</div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="appear">
      <div class="hero">
        <div class="hero-inner">
          <div class="hero-kicker">Journal of Agentic Systems · Vol.&thinsp;1</div>
          <h1 class="masthead">Agentic</h1>
          <p class="hero-tagline">Deep technical writing on agentic AI, architecture, and the engineering of reliable intelligent systems.</p>
          <div class="hero-meta">
            Issue&nbsp;<span class="em">001</span>
            <span class="hero-meta-sep">·</span>
            <span class="em">March 2026</span>
            <span class="hero-meta-sep">·</span>
            <span class="em">${ARTICLES.length}&nbsp;article${ARTICLES.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
      </div>

      <div class="articles-wrap">
        <div class="section-label">Latest Issue</div>
        ${featuredCard}
        ${grid}
      </div>
    </div>`;

  trackPageView();
}

/* ════════════════════════════════════════════════════════════════════
   ARTICLE
════════════════════════════════════════════════════════════════════ */

async function renderArticle(file) {
  const app  = document.getElementById('app');
  const meta = ARTICLES.find(a => a.file === file);

  // Loading skeleton
  app.innerHTML = `
    <div class="appear">
      <div class="article-back-bar">
        <button class="back-btn" onclick="goHome()">All Articles</button>
      </div>
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <span>Loading article</span>
      </div>
    </div>`;

  let raw;
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = await res.text();
  } catch (err) {
    app.innerHTML = `
      <div class="appear">
        <div class="article-back-bar">
          <button class="back-btn" onclick="goHome()">All Articles</button>
        </div>
        <div class="error-msg">
          <strong>Could not load article.</strong><br>
          Make sure <code>${esc(file)}</code> exists in the same directory as <code>index.html</code>.<br><br>
          <span style="color:var(--text-faint)">Error: ${esc(err.message)}</span>
        </div>
      </div>`;
    return;
  }

  // Parse + render
  const readTime = (meta && meta.readTime) || estimateReadTime(raw);
  const title    = (meta && meta.title)    || file;
  const subtitle = (meta && meta.subtitle) || '';
  const author   = (meta && meta.author)   || 'Ajay Sharma';
  const date     = (meta && meta.date)     ? fmtDate(meta.date) : '';
  const tags     = (meta && meta.tags)     || [];

  document.title = `${title} — Agentic`;

  let bodyHTML;
  try {
    bodyHTML = marked.parse(raw);
  } catch (e) {
    bodyHTML = `<p>Failed to parse markdown: ${esc(e.message)}</p>`;
  }

  app.innerHTML = `
    <div class="appear">
      <div class="article-back-bar">
        <button class="back-btn" onclick="goHome()">All Articles</button>
      </div>

      <div class="article-hd">
        ${tags.length ? `<div class="article-tags">${tagsHTML(tags)}</div>` : ''}
        <h1 class="article-title">${esc(title)}</h1>
        ${subtitle ? `<p class="article-subtitle">${esc(subtitle)}</p>` : ''}
        <div class="article-byline">
          <span class="byline-author">${esc(author)}</span>
          ${date ? `<span class="byline-sep">·</span><span>${date}</span>` : ''}
          ${readTime ? `<span class="byline-sep">·</span><span>${readTime}</span>` : ''}
        </div>
      </div>

      <div class="article-body">${bodyHTML}</div>

      <div class="article-feedback" id="feedback">
        <span class="feedback-q">Was this useful?</span>
        <div class="feedback-btns">
          <button class="feedback-btn" data-vote="up" type="button" aria-label="Yes, this was useful">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
            <span>Yes</span>
          </button>
          <button class="feedback-btn" data-vote="down" type="button" aria-label="No, this was not useful">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path></svg>
            <span>No</span>
          </button>
        </div>
        <span class="feedback-thanks" hidden>Thanks for the feedback.</span>
      </div>
    </div>
    <aside class="feedback-rail" id="feedback-rail" aria-label="Was this article useful?">
      <span class="rail-label">Useful?</span>
      <button class="rail-btn" data-vote="up" type="button" aria-label="Yes, this was useful">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
      </button>
      <button class="rail-btn" data-vote="down" type="button" aria-label="No, this was not useful">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path></svg>
      </button>
    </aside>`;

  // Re-highlight any code blocks marked.js may have left un-highlighted
  document.querySelectorAll('.article-body pre code:not(.hljs)').forEach(el => {
    hljs.highlightElement(el);
  });

  // Render any Mermaid diagrams in the article body
  if (window.mermaid) {
    try {
      mermaid.run({ querySelector: '.article-body .mermaid' });
    } catch (e) { /* leave diagram source visible on error */ }
  }

  startProgress();
  trackPageView(file);
  setupFeedback(file, title);
}

/* ════════════════════════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════════════════════════ */

configureMarked();
if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    theme: 'neutral',
    fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  });
}
window.addEventListener('hashchange', route);
route();
</script>
